<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#ff6b81,#ff8fa3);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:white;
}

.card{
  width:340px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(16px);
  padding:28px;
  border-radius:24px;
  text-align:center;
  position:relative;
}

.photos{
  display:flex;
  justify-content:center;
  gap:14px;
  margin-bottom:15px;
}

.photos img{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid white;
}

button{
  padding:12px 24px;
  border:none;
  border-radius:18px;
  font-size:15px;
  cursor:pointer;
  margin:12px;
}

#yes{
  background:white;
  color:#ff4d6d;
  font-weight:600;
}

#no{
  background:#ffd6e0;
  color:#ff4d6d;
  position:absolute;
}

.success{
  display:none;
}

.success img{
  width:230px;
  border-radius:20px;
}
</style>
</head>

<body>

<div class="card" id="game">

  <div class="photos">
    <img src="MOIZ_LINK">
    <img src="ZEENAT_LINK">
  </div>

  <h2>Hey Zeenat 🤍</h2>
  <p>Try pressing "No" if you can 😌</p>

  <button id="yes">Yes ❤️</button>
  <button id="no">No</button>

</div>

<div class="success" id="success">
  <img src="MOIZ_LINK">
  <h2>You chose me 🤍</h2>
  <p>Best decision ever.</p>
</div>

<script>
const noBtn=document.getElementById("no");

function move(){
  const x=Math.random()*240-120;
  const y=Math.random()*240-120;
  noBtn.style.transform=`translate(${x}px,${y}px)`;
}

noBtn.onmouseover=move;
noBtn.ontouchstart=move;

document.getElementById("yes").onclick=()=>{
  document.getElementById("game").style.display="none";
  document.getElementById("success").style.display="block";
};
</script>

</body>
</html>
