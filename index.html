<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>For Zeenat ❤️</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#ff6b81,#ff8fa3);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:white;
}

/* floating hearts */
.heart{
  position:fixed;
  bottom:-20px;
  font-size:18px;
  animation:float 6s linear infinite;
  pointer-events:none;
}

@keyframes float{
  from{transform:translateY(0);opacity:1}
  to{transform:translateY(-110vh);opacity:0}
}

.card{
  width:350px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(18px);
  padding:30px;
  border-radius:24px;
  text-align:center;
  position:relative;
  box-shadow:0 25px 50px rgba(0,0,0,.25);
}

.photos{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-bottom:18px;
}

.photos img{
  width:95px;
  height:95px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid white;
}

h1{
  font-size:22px;
  margin:10px 0;
  letter-spacing:1px;
}

p{
  font-size:14px;
  opacity:.9;
}

button{
  padding:12px 24px;
  border:none;
  border-radius:18px;
  font-size:15px;
  cursor:pointer;
  margin:12px;
  transition:.2s;
}

#yes{
  background:white;
  color:#ff4d6d;
  font-weight:600;
}

#no{
  background:#ffd6e0;
  color:#ff4d6d;
  position:absolute;
}

/* success screen */
.success{
  display:none;
  text-align:center;
}

.success img{
  width:240px;
  border-radius:20px;
  margin-bottom:15px;
  animation:pop .4s ease;
}

@keyframes pop{
  from{transform:scale(.7);opacity:0}
  to{transform:scale(1);opacity:1}
}
</style>
</head>

<body>

<div class="card" id="game">

  <div class="photos">
    <!-- YOUR REAL IMAGES FROM GITHUB -->
    <img src="IMG_3697.jpg">
    <img src="1e7812a0-43c1-42e3-a658-0ccba9733ac3.jpg">
  </div>

  <h1>BE MY VALENTINE? ❤️</h1>

  <p>
    Long distance sucks…<br>
    but loving you is the easiest thing ever.
  </p>

  <p style="font-size:13px;opacity:.7;">(try pressing NO… if you can 😏)</p>

  <button id="yes">YES 💖</button>
  <button id="no">NO</button>

</div>


<div class="success" id="success">

  <img src="IMG_3697.jpg">

  <h2>She said YES 🤍</h2>

  <p>
    Best decision of your life.<br>
    Now you’re stuck with me forever 😌
  </p>

</div>


<script>
// floating hearts animation
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.style.left=Math.random()*100+"vw";
  h.innerText="💗";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},350);


// NO button runs away from cursor
const noBtn=document.getElementById("no");

function moveButton(e){
  const x=Math.random()*260-130;
  const y=Math.random()*260-130;
  noBtn.style.transform=`translate(${x}px,${y}px)`;
}

noBtn.onmouseover=moveButton;
noBtn.ontouchstart=moveButton;


// YES click → reveal screen
document.getElementById("yes").onclick=()=>{
  document.getElementById("game").style.display="none";
  document.getElementById("success").style.display="block";
};
</script>

</body>
</html>
